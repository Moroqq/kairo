# Эталонный конфиг nginx для Kairo. Копия того, что должно лежать
# в /etc/nginx/sites-available/kairo на VPS.
#
# Держим в репозитории намеренно: раздача /update/* и проксирование /sync
# раньше жили только на сервере, нигде не описанные, и именно это дважды
# оказывалось точкой отказа — сначала как отсутствующий /update/latest.json,
# потом как server-блок без proxy_pass, который certbot создал сам.
#
# Требуется мап $connection_upgrade — см. websocket-map.conf ниже по файлу
# (кладётся отдельно в /etc/nginx/conf.d/websocket-map.conf).

# ── HTTP → HTTPS для обоих доменов ───────────────────────────────────────
server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name kairoupdate.duckdns.org kairogoupyrlife.duckdns.org;

    return 301 https://$host$request_uri;
}

# ── Актуальный домен ─────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name kairoupdate.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/kairoupdate.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairoupdate.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # Голосовые файлы уходят в /ai; лимит Groq Whisper — 25 МБ.
    client_max_body_size 64m;
    # Long-poll /pairing/wait висит до 25 с — дефолтных 60 хватает, но с запасом.
    proxy_read_timeout   75s;

    # ВАЖНО: один location на всё. Отдельного location со статикой под
    # /update/ быть не должно — он перехватит запрос раньше бэкенда,
    # и апдейтер получит 404 от nginx вместо манифеста.
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Без этих двух строк WebSocket /sync не поднимется — синк молчит,
        # хотя /health отвечает.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# ── Старый домен ─────────────────────────────────────────────────────────
# Держим живым, пока не обновятся уже установленные клиенты: в сборках
# до 0.4.8 зашит именно он, и другого канала доставки обновления у них нет.
# Убрать, когда все устройства переедут.
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    server_name kairogoupyrlife.duckdns.org;

    # Сертификат тот же, что у актуального домена: оба имени выпущены одной
    # командой и лежат в нём как SAN. Отдельный каталог
    # /etc/letsencrypt/live/kairogoupyrlife.duckdns.org/ был на прежнем
    # сервере, где certbot запускали по домену отдельно, — на новом его нет,
    # и nginx не стартовал с "cannot load certificate".
    ssl_certificate     /etc/letsencrypt/live/kairoupdate.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairoupdate.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 64m;
    proxy_read_timeout   75s;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

