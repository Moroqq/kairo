<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kairo" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="description" content="Kairo — терминал для управления задачами" />
    <title>Kairo</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Шрифт JetBrains Mono подключён локально через @fontsource (см. main.tsx) -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      /*
       * Service worker — только для веб-версии.
       *
       * В нативном приложении он не нужен и вреден: файлы и так лежат локально,
       * а кэш с фиксированным именем после обновления отдаёт старый index.html,
       * который ссылается на бандлы с прежними хешами. Их в новой сборке нет —
       * получается белый экран при первом запуске, лечившийся ручной
       * перезагрузкой. Поэтому внутри приложения не регистрируем, а заодно
       * сносим то, что успели зарегистрировать прежние версии.
       */
      (function () {
        if (!('serviceWorker' in navigator)) return;

        var native =
          location.protocol === 'tauri:' ||
          location.hostname === 'tauri.localhost' ||
          !!window.__TAURI_INTERNALS__ ||
          !!window.__TAURI__;

        if (native) {
          navigator.serviceWorker.getRegistrations()
            .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
            .catch(function () {});
          if (window.caches && caches.keys) {
            caches.keys()
              .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
              .catch(function () {});
          }
          return;
        }

        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js');
        });
      })();
    </script>
  </body>
</html>
